[project]
name = "sts-cua"
version = "0.1.0"
description = "A pixel-only computer-use agent that plays Slay the Spire 2"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "mss>=10.2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pygame>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sts_cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
